# Construye la imagen de jSDR (API + web) y la publica en GitHub Container Registry.
#
# Se dispara con cada push a main que toque api/ o web/, y también a mano desde
# la pestaña Actions del repo.
#
# Publica:
#   ghcr.io/thedanthes/jsdr-api:latest
#   ghcr.io/thedanthes/jsdr-api:<sha>
name: Construir imagen de la API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'Dockerfile'
      - '.github/workflows/build-api.yml'
  workflow_dispatch:

env:
  IMAGEN: ghcr.io/thedanthes/jsdr-api

jobs:
  # Antes de construir nada: si no compila, no se publica una imagen rota.
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: API — tipos
        working-directory: api
        run: |
          npm ci
          npx tsc --noEmit

      - name: Web — tipos y build
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  construir:
    needs: comprobar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # sin esto el push a ghcr.io falla con 403

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # lo provee Actions, no hay que crearlo

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          # La raíz del repo: la imagen compila api/ y web/ juntas.
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGEN }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.IMAGEN }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

# jSDR Port Web — despliegue en ZimaOS
#
# Container Manager → Apps → + → Instalar una app personalizada → Importar.
#
# ANTES DE IMPORTAR: cambiar JSDR_SECRETO_SESION, más abajo.
#
# IMPORTANTE: este archivo no usa NINGUNA variable ni interpolación.
# Container Manager de ZimaOS NO interpreta la sintaxis de variables con valor
# por defecto de Docker Compose: la reemplaza por vacío. Eso hacía que
# POSTGRES_PASSWORD llegara sin valor y Postgres abortara al iniciar.
# Todo va literal. La contraseña aparece en DOS lugares y tienen que coincidir.
#
# La base ya está restaurada en /DATA/AppData/jsdr/postgres, con sus índices.
# Levantar este stack NO la toca: los datos viven en el bind mount.

name: jsdr

x-casaos:
  architectures:
    - amd64
  main: api
  author: OnDesk
  developer: OnDesk
  category: Developer
  title:
    en_us: jSDR Port Web
    es_ar: jSDR Port Web
  tagline:
    en_us: Newsroom system — read-only web port (phase 1)
    es_ar: Sistema de redacción — port web de sólo lectura (fase 1)
  description:
    es_ar: >
      Port web del sistema de redacción jSDR. La Fase 1 expone la web y una API
      de sólo lectura sobre una copia restaurada de la base de producción.
  index: /
  port_map: "3099"
  scheme: http

services:

  # --------------------------------------------------------------------------
  #  Base de datos — la copia de producción, ya restaurada
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: jsdr-db
    environment:
      POSTGRES_USER: jsdr
      POSTGRES_PASSWORD: jsdr_dev
      POSTGRES_DB: jsdr_copia
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: America/Argentina/Buenos_Aires
    volumes:
      # Bind mounts: se ven y se respaldan desde el explorador de archivos.
      - /DATA/AppData/jsdr/postgres:/var/lib/postgresql/data
      - /DATA/AppData/jsdr/db:/db:ro
      - /DATA/AppData/jsdr/dumps:/dumps:ro
    ports:
      # Sólo en la LAN. 55432 para no chocar con otro Postgres del ZimaOS.
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jsdr -d jsdr_copia"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  #  La aplicación — API y web, en el mismo puerto
  # --------------------------------------------------------------------------
  api:
    # Paquete público: se baja sin `docker login`.
    # Para usar una imagen construida en el propio ZimaOS:  image: jsdr-api:local
    image: ghcr.io/thedanthes/jsdr-api:latest
    container_name: jsdr-api
    environment:
      DATABASE_URL: postgresql://jsdr:jsdr_dev@db:5432/jsdr_copia
      API_PORT: 3099
      LOG_LEVEL: info
      TZ: America/Argentina/Buenos_Aires
      JSDR_SALIDA_INDESIGN: /salida-indesign

      # >>> CAMBIAR ESTO <<<
      # Firma los tokens de sesión. Mientras no cambie, la gente sigue con la
      # sesión abierta después de un reinicio. Si se deja vacía, la API genera
      # una al azar en cada arranque y todos tienen que volver a entrar.
      JSDR_SECRETO_SESION: cambiar-esta-cadena-por-una-propia-larga

      # Horas que dura una sesión. Una jornada de redacción entra holgada.
      JSDR_HORAS_SESION: 12
    volumes:
      - /DATA/AppData/jsdr/salida-indesign:/salida-indesign
    ports:
      - "3099:3099"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
